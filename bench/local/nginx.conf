# A local origin for `compare.py`: nginx on 127.0.0.1:8088 serving
# `/tmp/fdm-www`, with three ways to be a host.
#
#   /big.bin            the link is the limit
#   /capped/<file>      every connection gets 300 KB/s — speedtest.tele2.net
#   /mixed/<file>       300 KB/s, 1 MB/s or 3 MB/s by source port — a CDN
#                       whose edges differ, like mirrors.kernel.org
#
# `serve.sh` writes the files and starts this; `shape.sh` puts a link in
# front of it.
worker_processes 2;
error_log /tmp/fdm-ngx/error.log;
pid /tmp/fdm-ngx/nginx.pid;
events { worker_connections 256; }
http {
  log_format conn "$connection $request_time $bytes_sent $request";
  access_log /tmp/fdm-ngx/access.log conn;
  sendfile on;
  split_clients "${remote_port}" $mixed_rate {
    40%  300k;
    30%  1m;
    *    3m;
  }
  server {
    listen 127.0.0.1:8088;
    location /        { root /tmp/fdm-www; add_header Last-Modified "Tue, 15 Nov 1994 12:45:26 GMT"; }
    location /capped/ { alias /tmp/fdm-www/; limit_rate 300k; }
    location /mixed/  { alias /tmp/fdm-www/; limit_rate $mixed_rate; }
  }
}
